<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>控制台 - ARCHMOND云电脑自维护平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-dark: #0a0a0f;
            --bg-card: #15151f;
            --bg-card-hover: #1a1a28;
            --accent-primary: #667eea;
            --accent-secondary: #764ba2;
            --accent-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --text-muted: #666680;
            --border-color: #2a2a3a;
            --success: #4ade80;
            --danger: #f87171;
            --warning: #fbbf24;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
        }
        
        /* 背景网格效果 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(102, 126, 234, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(102, 126, 234, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }
        
        /* 顶部导航 */
        .navbar {
            background: rgba(15, 15, 25, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            color: white;
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .navbar-brand {
            font-size: 18px;
            font-weight: 600;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .navbar-user {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .navbar-user span {
            font-size: 14px;
            color: var(--text-secondary);
        }
        .btn-logout {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .btn-logout:hover {
            background: var(--bg-card);
            color: var(--text-primary);
            border-color: var(--accent-primary);
        }

        /* 主内容区 */
        .main-content {
            padding: 32px 24px;
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* 标签页 */
        .tabs {
            display: flex;
            gap: 4px;
            background: var(--bg-card);
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 32px;
            border: 1px solid var(--border-color);
            width: fit-content;
        }
        .tab {
            padding: 12px 28px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
        }
        .tab:hover {
            color: var(--text-primary);
            background: rgba(102, 126, 234, 0.1);
        }
        .tab.active {
            background: var(--accent-gradient);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        /* 虚机卡片网格 */
        .vm-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 24px;
        }

        /* 虚机卡片 */
        .vm-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s ease;
        }
        .vm-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-primary);
            box-shadow: 0 8px 32px rgba(102, 126, 234, 0.15);
        }
        .vm-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .vm-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .vm-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .vm-status.running {
            background: rgba(74, 222, 128, 0.15);
            color: var(--success);
            border: 1px solid rgba(74, 222, 128, 0.3);
        }
        .vm-status.stopped {
            background: rgba(248, 113, 113, 0.15);
            color: var(--danger);
            border: 1px solid rgba(248, 113, 113, 0.3);
        }
        .vm-status.unknown {
            background: rgba(160, 160, 176, 0.15);
            color: var(--text-secondary);
            border: 1px solid rgba(160, 160, 176, 0.3);
        }

        /* 资源信息 */
        .vm-resources {
            margin-bottom: 20px;
        }
        .resource-item {
            margin-bottom: 14px;
        }
        .resource-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .resource-bar {
            height: 6px;
            background: rgba(255,255,255,0.05);
            border-radius: 3px;
            overflow: hidden;
        }
        .resource-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s ease;
        }
        .resource-bar-fill.cpu {
            background: linear-gradient(90deg, #667eea, #764ba2);
        }
        .resource-bar-fill.memory {
            background: linear-gradient(90deg, #f093fb, #f5576c);
        }
        .resource-bar-fill.disk {
            background: linear-gradient(90deg, #4facfe, #00f2fe);
        }

        .vm-info {
            display: flex;
            gap: 16px;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        /* 操作按钮 */
        .vm-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-start {
            background: rgba(74, 222, 128, 0.15);
            color: var(--success);
            border: 1px solid rgba(74, 222, 128, 0.3);
        }
        .btn-start:hover {
            background: rgba(74, 222, 128, 0.25);
        }
        .btn-stop {
            background: rgba(248, 113, 113, 0.15);
            color: var(--danger);
            border: 1px solid rgba(248, 113, 113, 0.3);
        }
        .btn-stop:hover {
            background: rgba(248, 113, 113, 0.25);
        }
        .btn-restart {
            background: rgba(96, 165, 250, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(96, 165, 250, 0.3);
        }
        .btn-restart:hover {
            background: rgba(96, 165, 250, 0.25);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* 加载状态 */
        .loading-container {
            text-align: center;
            padding: 80px;
            color: var(--text-secondary);
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 80px;
            color: var(--text-muted);
        }
        
        /* Horizon 链接区域 */
        .horizon-section {
            display: flex;
            gap: 20px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }
        .horizon-btn {
            flex: 1;
            min-width: 280px;
            padding: 24px 32px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            text-align: center;
            text-decoration: none;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .horizon-btn:hover {
            transform: translateY(-4px);
            border-color: var(--accent-primary);
            box-shadow: 0 8px 32px rgba(102, 126, 234, 0.2);
        }
        .horizon-btn-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: var(--accent-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        .horizon-btn-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .horizon-btn-desc {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* 错误提示 */
        .error-toast {
            position: fixed;
            top: 80px;
            right: 24px;
            background: rgba(248, 113, 113, 0.15);
            border: 1px solid rgba(248, 113, 113, 0.3);
            color: var(--danger);
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 1000;
            display: none;
            backdrop-filter: blur(10px);
        }

        /* 成功提示 */
        .success-toast {
            position: fixed;
            top: 80px;
            right: 24px;
            background: rgba(74, 222, 128, 0.15);
            border: 1px solid rgba(74, 222, 128, 0.3);
            color: var(--success);
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 1000;
            display: none;
            backdrop-filter: blur(10px);
        }

        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 页面标题 */
        .page-header {
            margin-bottom: 32px;
        }
        .page-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        .page-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <nav class="navbar">
        <div class="navbar-brand">ARCHMOND云电脑自维护平台</div>
        <div class="navbar-user">
            <span id="currentUser">欢迎, {{ display_name }}</span>
            <button class="btn-logout" onclick="logout()">退出登录</button>
        </div>
    </nav>

    <!-- 主内容 -->
    <main class="main-content">
        <!-- Horizon 快捷链接 -->
        <div class="horizon-section">
            <a href="https://horizon.archmond.ltd/" target="_blank" class="horizon-btn">
                <div class="horizon-btn-icon">🌐</div>
                <div class="horizon-btn-title">内网登录</div>
                <div class="horizon-btn-desc">horizon.archmond.ltd</div>
            </a>
            <a href="https://remote.archmond.ltd:4433/" target="_blank" class="horizon-btn">
                <div class="horizon-btn-icon">🔒</div>
                <div class="horizon-btn-title">外网登录</div>
                <div class="horizon-btn-desc">remote.archmond.ltd:4433</div>
            </a>
        </div>

        <!-- 标签页 -->
        <div class="tabs">
            <button class="tab active" data-tab="pve">PVE虚机</button>
        </div>

        <!-- PVE虚机 -->
        <div id="pve-content" class="tab-content active">
            <div id="pve-loading" class="loading-container" style="display: none;">
                <div class="spinner"></div>
                <p>加载中...</p>
            </div>
            <div id="pve-empty" class="empty-state" style="display: none;">
                <p>暂无比您有权限访问的虚机</p>
            </div>
            <div id="pve-grid" class="vm-grid"></div>
        </div>
    </main>

    <!-- 提示消息 -->
    <div id="errorToast" class="error-toast"></div>
    <div id="successToast" class="success-toast"></div>

    <script>
        // 页面加载时检查登录状态并加载数据
        document.addEventListener('DOMContentLoaded', async () => {
            const response = await fetch('/api/auth/check');
            const result = await response.json();

            if (!result.logged_in) {
                window.location.href = '/login';
                return;
            }

            // 加载虚机数据
            loadPveVms();
        });

        // 加载PVE虚机列表
        async function loadPveVms() {
            document.getElementById('pve-loading').style.display = 'block';
            document.getElementById('pve-grid').innerHTML = '';
            document.getElementById('pve-empty').style.display = 'none';

            try {
                const response = await fetch('/api/pve/vms');
                const result = await response.json();

                document.getElementById('pve-loading').style.display = 'none';

                if (result.success && result.vms.length > 0) {
                    renderPveVms(result.vms);
                } else if (result.success) {
                    document.getElementById('pve-empty').style.display = 'block';
                } else {
                    showError(result.message || '获取虚机列表失败');
                }
            } catch (error) {
                document.getElementById('pve-loading').style.display = 'none';
                showError('网络错误，请刷新页面');
            }
        }

        // 渲染PVE虚机卡片
        function renderPveVms(vms) {
            const grid = document.getElementById('pve-grid');
            grid.innerHTML = vms.map(vm => {
                const memPercent = vm.memory.raw_max ? Math.round(vm.memory.raw_used / vm.memory.raw_max * 100) : 0;
                const diskPercent = vm.memory.raw_max ? Math.round(vm.disk.raw_used / vm.disk.raw_max * 100) : 0;
                const isRunning = vm.status === 'running';

                return `
                <div class="vm-card">
                    <div class="vm-card-header">
                        <span class="vm-name">${vm.name}</span>
                        <span class="vm-status ${vm.status}">${vm.status === 'running' ? '运行中' : '已停止'}</span>
                    </div>
                    <div class="vm-resources">
                        <div class="resource-item">
                            <div class="resource-label">
                                <span>CPU</span>
                                <span>${vm.cpu.usage || 0}%</span>
                            </div>
                            <div class="resource-bar">
                                <div class="resource-bar-fill cpu" style="width: ${vm.cpu.usage || 0}%"></div>
                            </div>
                        </div>
                        <div class="resource-item">
                            <div class="resource-label">
                                <span>内存</span>
                                <span>${memPercent}%</span>
                            </div>
                            <div class="resource-bar">
                                <div class="resource-bar-fill memory" style="width: ${memPercent}%"></div>
                            </div>
                        </div>
                        <div class="resource-item">
                            <div class="resource-label">
                                <span>磁盘</span>
                                <span>${diskPercent}%</span>
                            </div>
                            <div class="resource-bar">
                                <div class="resource-bar-fill disk" style="width: ${diskPercent}%"></div>
                            </div>
                        </div>
                    </div>
                    <div class="vm-info">
                        <span>CPU: ${vm.cpu.count}核</span>
                        <span>内存: ${vm.memory.max}</span>
                        <span>运行时间: ${vm.uptime}</span>
                    </div>
                    <div class="vm-actions">
                        ${isRunning ? `
                            <button class="btn btn-restart" onclick="pveAction(${vm.vmid}, 'reboot')">软重启</button>
                            <button class="btn btn-restart" onclick="pveAction(${vm.vmid}, 'reset')">硬重启</button>
                            <button class="btn btn-stop" onclick="pveAction(${vm.vmid}, 'shutdown')">软关机</button>
                            <button class="btn btn-stop" onclick="pveAction(${vm.vmid}, 'stop')">强制关机</button>
                        ` : `
                            <button class="btn btn-start" onclick="pveAction(${vm.vmid}, 'start')">开机</button>
                        `}
                    </div>
                </div>
            `;
            }).join('');
        }

        // PVE虚机操作
        async function pveAction(vmid, action) {
            const actionNames = {
                'start': '开机',
                'stop': '强制关机',
                'shutdown': '软关机',
                'reboot': '软重启',
                'reset': '硬重启'
            };

            try {
                const response = await fetch(`/api/pve/vm/${vmid}/${action}`, {
                    method: 'POST'
                });
                const result = await response.json();

                if (result.success) {
                    showSuccess(`${actionNames[action]}请求已发送`);
                    setTimeout(loadPveVms, 2000);
                } else {
                    showError(result.message || `${actionNames[action]}失败`);
                }
            } catch (error) {
                showError('网络错误');
            }
        }

        // 登出
        async function logout() {
            try {
                await fetch('/api/auth/logout', { method: 'POST' });
                window.location.href = '/login';
            } catch (error) {
                window.location.href = '/login';
            }
        }

        // 显示错误提示
        function showError(message) {
            const toast = document.getElementById('errorToast');
            toast.textContent = message;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }

        // 显示成功提示
        function showSuccess(message) {
            const toast = document.getElementById('successToast');
            toast.textContent = message;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
